[package]
name = "catalog-bench"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
topcoat = { version = "0.10.0", features = ["tailwind"] }

[build-dependencies]
topcoat = { version = "0.10.0", default-features = false, features = ["tailwind"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
